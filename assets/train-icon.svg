<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 26" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="55%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Световой луч фары вперёд -->
  <polygon points="55,15 64,12 64,20 55,18" fill="url(#beam)"/>
  <!-- Пантограф / токоприёмник (отсылка к ТПС - электровоз!) -->
  <path d="M16 5 L22 2 L28 5 M20 2 L24 2" stroke="#9CA3AF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Аэродинамический корпус локомотива/Сапсана -->
  <path d="M4 19 L4 9 C4 6.8 5.8 5 8 5 L38 5 C45 5 52 9.5 56.5 14.5 C57.6 15.8 57.2 19 55 19 Z" fill="url(#bodyGrad)"/>
  <!-- Тёмное лобовое стекло кабины -->
  <path d="M39 7.2 L47 8.5 C50 10.2 52.3 12 53.6 13.4 L39 13.4 Z" fill="#0B0B0F"/>
  <!-- Боковые окна -->
  <rect x="9" y="8" width="7" height="4.2" rx="1.2" fill="#0B0B0F"/>
  <rect x="18.5" y="8" width="7" height="4.2" rx="1.2" fill="#0B0B0F"/>
  <rect x="28" y="8" width="7.5" height="4.2" rx="1.2" fill="#0B0B0F"/>
  <!-- Фирменная красная полоса РЖД вдоль борта -->
  <path d="M4 15.2 L55.8 15.2" stroke="#E21A1A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Нижняя рама и колёсные пары -->
  <rect x="6" y="19" width="46" height="2" rx="1" fill="#1F242D"/>
  <circle cx="13" cy="22" r="2.2" fill="#9CA3AF" stroke="#111116" stroke-width="1"/>
  <circle cx="21" cy="22" r="2.2" fill="#9CA3AF" stroke="#111116" stroke-width="1"/>
  <circle cx="38" cy="22" r="2.2" fill="#9CA3AF" stroke="#111116" stroke-width="1"/>
  <circle cx="46" cy="22" r="2.2" fill="#9CA3AF" stroke="#111116" stroke-width="1"/>
  <!-- Красный габаритный огонь / фара -->
  <circle cx="55.2" cy="16.5" r="1.4" fill="#FF3B30"/>
</svg>
